name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript, python]
    steps:

      - name: Checkout repository
        uses: hashcode404/reusable_gh_actions/.github/actions/checkout@main 
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@master
        with:
          node-version: "20"

      - name: CodeQL Action
        uses: hashcode404/reusable_gh_actions/.github/actions/codeql@main 
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          