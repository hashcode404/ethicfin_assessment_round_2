name: zizmor

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
            persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      - name: Run zizmor
        run: uvx zizmor .github/workflows